site_name: SENTINEL
site_description: Autonomous Forensic Agent powered by LangGraph, Local LLMs, and RAG.
site_author: Uday Grover
repo_url: https://github.com/udaygr0ver/SENTINEL

theme:
  name: material
  palette:
    # Palette toggle for dark mode
    - scheme: slate
      primary: teal
      accent: cyan

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - User Guide: usage.md
  - Extending SENTINEL: development.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
