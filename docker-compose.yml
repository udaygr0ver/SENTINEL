version: '3.8'

services:
  sentinel-api:
    build: .
    container_name: sentinel_api
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    environment:
      # Use host.docker.internal to reach local Ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    networks:
      - sentinel_net

  sentinel-ui:
    build: .
    container_name: sentinel_ui
    command: streamlit run src/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    environment:
      - API_URL=http://sentinel-api:8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - sentinel-api
    networks:
      - sentinel_net

networks:
  sentinel_net:
    driver: bridge
